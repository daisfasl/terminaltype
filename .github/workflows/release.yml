name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build:content
      - run: bun build src/cli.tsx --compile --target=bun-darwin-arm64 --outfile dist/terminaltype-darwin-arm64
      - run: bun build src/cli.tsx --compile --target=bun-darwin-x64 --outfile dist/terminaltype-darwin-x64
      - name: Compute checksums
        run: |
          cd dist
          shasum -a 256 terminaltype-darwin-arm64 > terminaltype-darwin-arm64.sha256
          shasum -a 256 terminaltype-darwin-x64 > terminaltype-darwin-x64.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tui/dist/terminaltype-darwin-arm64
            tui/dist/terminaltype-darwin-arm64.sha256
            tui/dist/terminaltype-darwin-x64
            tui/dist/terminaltype-darwin-x64.sha256
